    <style>
        #boot-splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; background: linear-gradient(#182b38, #596452 72%, #1b291b); color: #f6edc5; font: 15px monospace; }
        #boot-logo { width: min(78vw, 440px); height: auto; image-rendering: pixelated; }
        #boot-splash .boot-bar { position: relative; width: min(56vw, 240px); height: 10px; border: 2px solid #bccc9c; background: #182319; overflow: hidden; }
        #boot-splash .boot-bar i { position: absolute; inset: 0; background: #f6d776; transform-origin: left; transform: scaleX(var(--p, .3)); }
        /* Until real progress arrives the bar sweeps on the compositor, so it keeps moving while the page is busy. */
        #boot-splash:not([style*="--p"]) .boot-bar i { width: 35%; transform: none; animation: boot-sweep 1.1s steps(12) infinite alternate; }
        @keyframes boot-sweep { from { left: 0; } to { left: 65%; } }
        #boot-splash .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        @media (prefers-reduced-motion: reduce) { #boot-splash:not([style*="--p"]) .boot-bar i { animation: none; left: 32%; } }
    </style>
